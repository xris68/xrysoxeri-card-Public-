<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>XRYSO XERI</title>

<meta name="apple-mobile-web-app-title" content="XRYSO XERI">
<meta property="og:title" content="XRYSO XERI">
<meta property="og:site_name" content="XRYSO XERI">

<style>

body{
font-family: Arial;
background:#f4f0fa;
text-align:center;
padding:20px;
}

.card{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

img{
width:100%;
border-radius:10px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
font-size:16px;
border:none;
border-radius:10px;
background:#6a2ca0;
color:white;
cursor:pointer;
}

button:hover{
background:#4d1f75;
}

/* ΩΡΑΡΙΟ */
.hours-card{
margin-top:15px;
padding:15px;
background:#faf7ff;
border-radius:12px;
border:1px solid #e2d6f3;
}

.hours-title{
font-weight:bold;
font-size:18px;
color:#4d1f75;
margin-bottom:10px;
}

.hours-row{
display:flex;
justify-content:space-between;
padding:4px 0;
font-size:15px;
}

.hours-day{
color:#4d1f75;
font-weight:bold;
}

.hours-time{
color:#222;
}

.closed{
color:#b00020;
font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h2>XRYSO XERI</h2>

<img src="https://raw.githubusercontent.com/xris68/xrysoxeri-card-Public-/main/%CE%B5%CE%B9%CE%BA%CE%BF%CE%BD%CE%B1%20%CE%BC%CF%89%CE%B2%20%CE%BA%CE%B1%CF%81%CF%84%CE%B1%CF%82.png">

<button onclick="saveContact()">📇 Αποθήκευση επαφής</button>

<button onclick="openMap()">📍 Άνοιγμα χάρτη</button>

<button onclick="callPhone()">📞 Κλήση</button>


<!-- ΩΡΑΡΙΟ -->
<div class="hours-card">

<div class="hours-title">🕒 Ωράριο λειτουργίας</div>

<div class="hours-row">
<span class="hours-day">Δευτέρα</span>
<span class="hours-time">10:00 – 15:00</span>
</div>

<div class="hours-row">
<span class="hours-day">Τρίτη</span>
<span class="hours-time">10:00 – 14:00 & 17:00 – 20:30</span>
</div>

<div class="hours-row">
<span class="hours-day">Τετάρτη</span>
<span class="hours-time">10:00 – 15:00</span>
</div>

<div class="hours-row">
<span class="hours-day">Πέμπτη</span>
<span class="hours-time">10:00 – 14:00 & 17:00 – 20:30</span>
</div>

<div class="hours-row">
<span class="hours-day">Παρασκευή</span>
<span class="hours-time">10:00 – 14:00 & 17:00 – 20:30</span>
</div>

<div class="hours-row">
<span class="hours-day">Σάββατο</span>
<span class="hours-time">10:00 – 15:00</span>
</div>

<div class="hours-row">
<span class="hours-day">Κυριακή</span>
<span class="hours-time closed">ΚΛΕΙΣΤΑ</span>
</div>

</div>

</div>


<script>

function saveContact(){

const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:XRYSO XERI
ORG:XRYSO XERI
TEL:2106899772
ADR:;;Αγίου Γεωργίου 19, Χαλάνδρι;;;;
END:VCARD`;

const blob = new Blob([vcard], {type: "text/vcard"});
const link = document.createElement("a");

link.href = URL.createObjectURL(blob);
link.download = "XRYSO_XERI.vcf";
link.click();
}

function openMap(){

window.open(
"https://www.google.com/maps/search/?api=1&query=Αγίου+Γεωργίου+19,+Χαλάνδρι"
);

}

function callPhone(){

window.open("tel:2106899772");

}

</script>

</body>
</html>
